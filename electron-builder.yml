# Windows build: an installer and a portable .exe, both from `npm run dist:win`.
appId: com.diskanalyzer.app
productName: Analisador de Disco
copyright: Copyright © 2026
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!out/main/bench.js"
  - "!out/tests/**"
asar: true

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# Installer: per-user by default (no admin rights needed), Brazilian Portuguese, with a real uninstaller.
nsis:
  artifactName: analisador-de-disco-${version}-installer.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Analisador de Disco
  uninstallDisplayName: Analisador de Disco
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerLanguages: [pt_BR]
  language: "1046"
  deleteAppDataOnUninstall: false

# Portable: a single .exe that runs without installing. Settings and saved scans live next to it
# (see src/main/portable.ts).
portable:
  artifactName: analisador-de-disco-${version}-portable.${ext}
